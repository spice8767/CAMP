local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: map
      robot_base_frame: nav_base_link
      use_sim_time: True
      rolling_window: True
      width: 15
      height: 15
      resolution: 0.1
      # Buggy geometric footprint (Length ~3.2m, Width ~1.6m)
      # Coordinates are [x, y] relative to base_link
      footprint: "[ [1.6, 0.8], [1.6, -0.8], [-1.6, -0.8], [-1.6, 0.8] ]"
      
      plugins: ["obstacle_layer", "inflation_layer"]
      
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        # observation_sources is where we feed the LiDAR data
        observation_sources: scan
        scan:
          # Topic from Gazebo
          topic: /cloud 
          # We expect standard PointCloud2
          data_type: PointCloud2
          # Only trust points within 15 meters for local dodging
          max_obstacle_height: 2.2
          min_obstacle_height: 0.1
          obstacle_max_range: 15.0
          raytrace_max_range: 16.0
          clearing: True
          marking: True
          
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # How far out to pad the obstacles so the buggy stays away
        inflation_radius: 1.0
        cost_scaling_factor: 5.0

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
      
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 1.0
      yaw_goal_tolerance: 0.5
      stateful: True

    # We are using Regulated Pure Pursuit for aggressive Ackermann path following
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 2.22
      lookahead_dist: 4.0
      min_lookahead_dist: 2.0
      max_lookahead_dist: 6.0
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.5
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.3
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0
      regulated_linear_scaling_min_radius: 3.5
      regulated_linear_scaling_min_speed: 0.5
