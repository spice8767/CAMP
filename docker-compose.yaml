services:
  jazzy:
    build:
      context: ./docker
      args:
        USER_UID: 1000   # check with: id -u
        USER_GID: 1000
    image: camp-jazzy
    container_name: camp-jazzy
    runtime: nvidia                      # added
    network_mode: host
    ipc: host
    stdin_open: true
    tty: true
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=42
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - __NV_PRIME_RENDER_OFFLOAD=1      # added: use the NVIDIA GPU on a hybrid laptop
      - __GLX_VENDOR_LIBRARY_NAME=nvidia # added
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - .:/home/dev/ws
    devices:
      - /dev/dri:/dev/dri